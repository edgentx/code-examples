# The dead-letter topic needs a subscriber of its own, or parked messages sit in
# a queue nobody reads -- which is the same as losing them, only slower. This
# subscription is what turns "parked" into "visible to a human".
#
# It has no deadLetterTopic of its own on purpose: there is nowhere further to
# fall, so a failure here must be retried until the record is written.
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: intake-notices-parked
spec:
  pubsubname: intake-pubsub
  topic: intake-notices-parked
  routes:
    default: /events/dead-letter
scopes:
  - intake-subscriber
