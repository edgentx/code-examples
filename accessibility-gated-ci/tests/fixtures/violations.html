<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deliberately broken copy of the request form</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      /* DEFECT 3 of 4: 2.8:1 against the white background it sits on. Needs 4.5:1. */
      .fine-print {
        background: #ffffff;
        color: #999999;
      }
    </style>
  </head>
  <body>
    <!--
      This file is the control sample for the gate. It is the same form as public/index.html with
      four defects planted in it, each one a rule the automated scan must catch. Nothing here is
      meant to be copied; tests/accessibility.spec.ts asserts that axe reports every one of these
      by rule id, which is what proves the gate on the real page is actually running and not
      quietly passing an empty result set.

      Planted defects, in document order:
        1. label         - the name input has no <label> and no accessible name at all
        2. heading-order - <h1> is followed by <h3>, skipping level 2
        3. image-alt      - the seal image carries no alt attribute
        4. color-contrast - the fine print is #999999 on #ffffff
    -->
    <main>
      <h1>Request a copy of a public record</h1>

      <form>
        <!-- DEFECT 1 of 4: text with no label element, no aria-label, no title. -->
        <p>Full name</p>
        <input type="text" name="full-name" />

        <!-- DEFECT 2 of 4: h1 to h3, no h2 in between. -->
        <h3>What you are asking for</h3>

        <label for="records">Describe the records</label>
        <textarea id="records" name="records" rows="3"></textarea>

        <button type="submit">Submit request</button>
      </form>

      <!--
        DEFECT 4 of 4: no alt attribute. A 1x1 transparent GIF as a data URI keeps the fixture
        self-contained; axe reports the missing alt regardless of what the image contains.
      -->
      <img
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        width="48"
        height="48"
      />

      <p class="fine-print">
        Requests are answered in the order received. Fee waivers are decided separately.
      </p>
    </main>
  </body>
</html>
