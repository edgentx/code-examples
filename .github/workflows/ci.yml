name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: No committed secrets or internal endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: scripts/check-no-committed-secrets.sh

  go-examples:
    name: Go examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format, vet, and test every Go module
        run: |
          set -euo pipefail
          modules=$(find . -name go.mod -not -path './node_modules/*' | sort)
          if [ -z "${modules}" ]; then
            echo 'no Go modules yet'
            exit 0
          fi
          for module in ${modules}; do
            directory=$(dirname "${module}")
            echo "::group::${directory}"
            (
              cd "${directory}"
              unformatted=$(gofmt -l .)
              if [ -n "${unformatted}" ]; then
                echo "gofmt required for: ${unformatted}"
                exit 1
              fi
              go vet ./...
              # The race detector is on for every module. The records service's
              # locking, idempotency and outbox cases run several writers at
              # once on purpose, and a race there would otherwise show up as an
              # occasional wrong answer rather than as a failure.
              go test ./... -count=1 -race
            )
            echo '::endgroup::'
          done

  python-examples:
    name: Python examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test every Python example
        run: |
          set -euo pipefail
          requirements=$(find . -name requirements.txt -not -path './node_modules/*' | sort)
          if [ -z "${requirements}" ]; then
            echo 'no Python examples yet'
            exit 0
          fi
          for file in ${requirements}; do
            directory=$(dirname "${file}")
            echo "::group::${directory}"
            (
              cd "${directory}"
              python -m pip install --quiet --upgrade pip
              python -m pip install --quiet -r requirements.txt
              python -m pytest -q
            )
            echo '::endgroup::'
          done

  accessibility-gate:
    name: Accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the axe gate against the example page
        run: |
          set -euo pipefail
          directory=accessibility-gated-ci
          if [ ! -d "${directory}" ]; then
            echo 'accessibility example not present yet'
            exit 0
          fi
          cd "${directory}"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

  records-service-console:
    name: Records console unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check and test the console
        working-directory: records-service/web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test

  records-service-accessibility:
    name: Records console accessibility and keyboard gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run axe and the keyboard path against the real service
        working-directory: records-service/web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          # `npm run e2e` builds the console, starts the Go service serving it
          # from the same origin as the API, and runs both specs against it.
          npm run e2e

  records-service-authorization:
    name: Records service authorization model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Answer the same allow-and-deny matrix with a live OpenFGA
        run: |
          set -euo pipefail
          docker run -d --name openfga-records -p 8080:8080 openfga/openfga:v1.8.4 run
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
          cd records-service
          OPENFGA_API_URL=http://localhost:8080 go test ./openfgaauthz/... -count=1 -v

  rego-policies:
    name: Rego policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Open Policy Agent
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: Test every policy bundle
        run: |
          set -euo pipefail
          bundles=$(find . -name '*.rego' -not -path './node_modules/*' \
            -exec dirname {} \; | sort -u)
          if [ -z "${bundles}" ]; then
            echo 'no policy bundles yet'
            exit 0
          fi
          for bundle in ${bundles}; do
            echo "::group::${bundle}"
            opa test --verbose "${bundle}"
            echo '::endgroup::'
          done

  terraform-iac:
    name: Terraform infrastructure as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          # The wrapper rewrites stdout and exit codes, which breaks
          # `terraform test`.
          terraform_wrapper: false
      - name: Check formatting
        working-directory: terraform-iac
        run: terraform fmt -check -recursive
      - name: Validate and test the module
        working-directory: terraform-iac/modules/tenant-config
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Validate and plan the dev environment
        working-directory: terraform-iac/environments/dev
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform validate
          terraform plan -input=false

  authorization-sidecar-smoke:
    name: Authorization sidecar smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the authorization boundary end to end
        run: |
          set -euo pipefail
          directory=authorization-sidecar
          if [ ! -d "${directory}" ]; then
            echo 'authorization sidecar example not present yet'
            exit 0
          fi
          cd "${directory}"
          ./smoke.sh

  envoy-gateway-smoke:
    name: Envoy gateway smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring the gateway stack up and assert the demonstrations
        run: |
          set -euo pipefail
          directory=envoy-gateway
          if [ ! -d "${directory}" ]; then
            echo 'gateway example not present yet'
            exit 0
          fi
          cd "${directory}"
          ./smoke.sh

  otel-observability-smoke:
    name: Observability smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove one request produces one trace across both services
        run: |
          set -euo pipefail
          directory=otel-observability
          if [ ! -d "${directory}" ]; then
            echo 'observability example not present yet'
            exit 0
          fi
          cd "${directory}"
          ./smoke.sh

  dapr-pubsub-smoke:
    name: Dapr pub/sub smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish, retry, and park a poison message
        run: |
          set -euo pipefail
          directory=dapr-pubsub
          if [ ! -d "${directory}" ]; then
            echo 'pub/sub example not present yet'
            exit 0
          fi
          cd "${directory}"
          ./smoke.sh

  openfga-authorization:
    name: OpenFGA relationship checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run the checks against a live OpenFGA
        run: |
          set -euo pipefail
          directory=rebac-authorization
          if [ ! -d "${directory}" ]; then
            echo 'authorization example not present yet'
            exit 0
          fi
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.8.4 run
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
          cd "${directory}"
          OPENFGA_API_URL=http://localhost:8080 go test ./... -count=1

  envoy-config:
    name: Envoy configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate development certificates
        run: |
          set -euo pipefail
          # Envoy's validate mode loads every file the configuration references,
          # including TLS material. Certificates are generated, never committed.
          generators=$(find . -name 'generate-dev-certs.sh' | sort)
          for generator in ${generators}; do
            echo "::group::${generator}"
            (cd "$(dirname "${generator}")" && bash ./generate-dev-certs.sh)
            echo '::endgroup::'
          done
      - name: Validate every Envoy bootstrap
        run: |
          set -euo pipefail
          configs=$(find . -name 'envoy*.yaml' -not -path './node_modules/*' | sort)
          if [ -z "${configs}" ]; then
            echo 'no Envoy configuration yet'
            exit 0
          fi
          for config in ${configs}; do
            echo "::group::${config}"
            # Envoy resolves file references in the configuration against the
            # process working directory, so validation has to run from the
            # directory the configuration lives in.
            directory=$(dirname "${config}")
            docker run --rm -v "${PWD}:/workspace" -w "/workspace/${directory}" \
              envoyproxy/envoy:v1.34-latest --mode validate -c "$(basename "${config}")"
            echo '::endgroup::'
          done
